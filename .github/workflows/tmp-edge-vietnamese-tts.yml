name: tmp-edge-vietnamese-tts

on:
  push:
    paths:
      - '.github/workflows/tmp-edge-vietnamese-tts.yml'
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - name: Install TTS and audio tools
        run: |
          python -m pip install --quiet edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Write script
        run: |
          cat > script.txt <<'EOF'
          Có một nghịch lý trong quản trị: càng lo tổ chức mất kiểm soát, người lãnh đạo càng dễ can thiệp vào mọi thứ. Và càng can thiệp, hệ thống càng mất khả năng tự vận hành.

          Trong Đạo Đức Kinh, Lão Tử nói về “vô vi”. Nhưng vô vi không có nghĩa là không làm gì. Nó là không làm thừa; không ép hệ thống theo ý chí của mình khi nó có thể vận hành tốt bằng nguyên tắc rõ ràng.

          Một người sếp duyệt mọi email có thể cảm thấy mình đang kiểm soát chất lượng. Nhưng thực ra, anh ta đang dạy cả đội rằng: đừng tự quyết định.

          Một giám đốc nhảy vào giải quyết mọi xung đột có thể nghĩ mình đang bảo vệ tổ chức. Nhưng nếu việc gì cũng phải chờ giám đốc, năng lực phán đoán của cấp dưới sẽ teo đi.

          Lãnh đạo tốt không phải là hiện diện trong mọi quyết định. Mà là thiết kế một hệ thống trong đó mình có thể vắng mặt mà công việc vẫn chạy đúng.

          Có ba việc người lãnh đạo nên làm thật rõ: mục tiêu nào không được đánh đổi, nguyên tắc nào phải tuân thủ, và ranh giới nào cấp dưới được toàn quyền quyết định.

          Sau đó, hãy lùi lại đủ xa để con người trưởng thành.

          Lão Tử mô tả người lãnh đạo giỏi nhất là người mà khi công việc hoàn thành, mọi người nói: chính chúng ta đã làm được.

          Đỉnh cao của quyền lực không phải là khiến mọi việc phụ thuộc vào mình.

          Mà là xây một tổ chức không cần mình có mặt trong mọi việc.
          EOF
      - name: Verify voice exists and synthesize
        run: |
          edge-tts --list-voices | grep -F 'vi-VN-NamMinhNeural'
          edge-tts --voice vi-VN-NamMinhNeural --rate='+10%' --pitch='-8Hz' --file script.txt --write-media voice_namminh.mp3 --write-subtitles voice_namminh.vtt
          ffmpeg -y -i voice_namminh.mp3 -ar 48000 -ac 2 voice_namminh.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 voice_namminh.wav
      - name: Upload TTS artifact
        uses: actions/upload-artifact@v4
        with:
          name: alobase-wuwei-edge-tts
          path: |
            voice_namminh.wav
            voice_namminh.mp3
            voice_namminh.vtt
            script.txt
          retention-days: 1
