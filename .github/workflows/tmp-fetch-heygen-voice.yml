name: tmp-fetch-heygen-voice

on:
  push:
    paths:
      - '.github/workflows/tmp-fetch-heygen-voice.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Vietnamese voice
        run: |
          curl -fL --retry 3 'https://resource2.heygen.ai/text_to_speech/7bfba616382c452caf4b1f9f2d9ab01b/8af68d7ea38f4e7ca05cf46c3f7a590b/id=534cfd57-b5f8-4282-b514-5fd9cd19c70a.wav' -o voice_cuong_vi.wav
          test -s voice_cuong_vi.wav
          file voice_cuong_vi.wav
      - name: Upload voice artifact
        uses: actions/upload-artifact@v4
        with:
          name: heygen-voice-cuong
          path: voice_cuong_vi.wav
          retention-days: 1
