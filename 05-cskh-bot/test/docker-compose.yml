version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_cskh_bot_app
    ports:
      - "5678:5678"
    volumes:
      - ..:/data/05-cskh-bot
    environment:
      - N8N_LOG_LEVEL=warn
      - N8N_SECURE_COOKIE=false
      - N8N_USER_MANAGEMENT_DISABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    command: >
      sh -c "n8n import:workflow --input=/data/05-cskh-bot/checkpoints/n8n-cskh-bot-solution.json || true && n8n start"
